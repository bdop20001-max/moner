services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moner_manush
    ports:
      - "5432:5432"
    volumes:
      - moner_manush_db:/var/lib/postgresql/data

volumes:
  moner_manush_db:
